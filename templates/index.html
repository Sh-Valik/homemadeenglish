<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="English Learner — пошаговое изучение английского языка. Теория, практика, переводы и упражнения.">
    <title>English Learner — Изучение английского</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Starfield background -->
    <div class="starfield" id="starfield"></div>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-brand" onclick="window.location.hash='#/'">
            <span class="nav-logo">🌌</span>
            <span class="nav-title">English Learner</span>
        </div>
        <div class="nav-links">
            <a href="#/" class="nav-link active" data-page="home" id="nav-home">
                <span class="nav-icon">🏠</span> Главная
            </a>
            <a href="#/topics" class="nav-link" data-page="topics" id="nav-topics">
                <span class="nav-icon">📚</span> Темы
            </a>
            <a href="#/profile" class="nav-link" data-page="profile" id="nav-profile" style="display:none">
                <span class="nav-icon">👤</span> Профиль
            </a>
            <a href="#/login" class="nav-link" data-page="login" id="nav-login">
                <span class="nav-icon">🔑</span> Войти
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="app">
        <!-- Content will be dynamically loaded here -->
        <div class="loading-screen" id="loading">
            <div class="loading-spinner"></div>
            <p>Загрузка...</p>
        </div>
    </main>

    <!-- Toast notification -->
    <div class="toast-container" id="toast-container"></div>

    <script src="/static/js/router.js"></script>
    <script src="/static/js/theory.js"></script>
    <script src="/static/js/practice.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
